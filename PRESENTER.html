<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerPoint Presenter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;height:100vh}

/* Upload screen */
#uploadScreen{display:flex;align-items:center;justify-content:center;height:100vh}
.upload-box{background:#16213e;border:2px dashed #533483;border-radius:12px;padding:60px 80px;text-align:center;cursor:pointer;transition:border-color 0.3s}
.upload-box:hover{border-color:#e94560}
.upload-box h1{font-size:32px;margin-bottom:10px;color:#e94560}
.upload-box p{font-size:16px;color:#a0a0c0;margin-bottom:20px}
.upload-btn{background:#e94560;color:#fff;border:none;padding:14px 36px;font-size:18px;border-radius:6px;cursor:pointer}
.upload-btn:hover{background:#c0392b}
.loading{display:none;font-size:18px;color:#e94560;margin-top:20px}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:#16213e;border-bottom:1px solid #0f3460;height:50px}
.toolbar .title{font-size:14px;color:#a0a0c0;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;gap:8px;align-items:center}
.toolbar button{background:#0f3460;border:1px solid #533483;color:#e0e0ff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.toolbar button:hover{background:#533483}
.slide-counter{font-size:14px;color:#a0a0c0;margin:0 8px;min-width:60px;text-align:center}

/* Presenter */
#presenterScreen{display:none;height:100vh;flex-direction:column}
.main-area{display:flex;flex:1;overflow:hidden}

/* Thumbnails */
.slide-panel{width:160px;background:#16213e;overflow-y:auto;padding:8px;border-right:1px solid #0f3460}
.slide-panel.hidden{display:none}
.thumb{border:2px solid transparent;border-radius:4px;margin-bottom:6px;cursor:pointer;padding:3px;transition:border-color 0.2s}
.thumb.active{border-color:#e94560}
.thumb:hover{border-color:#533483}
.thumb img{width:100%;border-radius:2px;display:block}
.thumb-label{font-size:10px;text-align:center;color:#888;margin-top:2px}

/* Slide view */
.slide-view{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#111}
.slide-view img.slide-img{max-width:95%;max-height:95%;object-fit:contain;box-shadow:0 4px 30px rgba(0,0,0,0.6);border-radius:2px}

/* Nav */
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(15,52,96,0.7);border:none;color:#e0e0ff;font-size:28px;padding:15px 10px;cursor:pointer;border-radius:4px;z-index:10}
.nav-arrow:hover{background:rgba(83,52,131,0.9)}
.nav-arrow.left{left:10px}
.nav-arrow.right{right:10px}

/* Fullscreen */
body.fullscreen .toolbar{display:none}
body.fullscreen .slide-panel{display:none!important}
body.fullscreen #presenterScreen{height:100vh}
body.fullscreen .slide-view{background:#000}
body.fullscreen .nav-arrow{opacity:0;transition:opacity 0.3s}
body.fullscreen .slide-view:hover .nav-arrow{opacity:1}
</style>
</head>
<body>

<!-- Upload Screen -->
<div id="uploadScreen">
<div class="upload-box" id="dropZone">
    <h1>PowerPoint Presenter</h1>
    <p>Open .pptx files without PowerPoint</p>
    <p style="font-size:13px;margin-bottom:25px">Your file stays in .pptx format for sharing</p>
    <input type="file" id="fileInput" accept=".pptx,.ppt" style="display:none">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Choose .pptx File</button>
    <div class="loading" id="loading">Loading presentation...</div>
</div>
</div>

<!-- Presenter Screen -->
<div id="presenterScreen">
<div class="toolbar">
    <div class="title" id="fileName">Presentation</div>
    <div class="controls">
        <button onclick="togglePanel()">Thumbnails</button>
        <button onclick="prevSlide()">&#9664; Prev</button>
        <span class="slide-counter"><span id="currentNum">1</span> / <span id="totalNum">1</span></span>
        <button onclick="nextSlide()">Next &#9654;</button>
        <button onclick="toggleFullscreen()" style="background:#e94560;border-color:#e94560">Present (F5)</button>
        <button onclick="location.reload()">Open New File</button>
    </div>
</div>
<div class="main-area">
    <div class="slide-panel" id="slidePanel"></div>
    <div class="slide-view" id="slideView">
        <button class="nav-arrow left" onclick="prevSlide()">&#9664;</button>
        <img class="slide-img" id="mainSlide" src="" alt="Slide">
        <button class="nav-arrow right" onclick="nextSlide()">&#9654;</button>
    </div>
</div>
</div>

<script>
let slides = [];
let current = 0;

// Drag and drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#e94560'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#533483'; });
dropZone.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => { if(e.target.files.length) loadFile(e.target.files[0]); });

async function loadFile(file) {
    if (!file.name.match(/\.pptx?$/i)) { alert('Please select a .pptx file'); return; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('fileName').textContent = file.name;

    try {
        const zip = await JSZip.loadAsync(file);
        slides = [];

        // Find slide count from [Content_Types].xml or just find slide files
        const slideFiles = [];
        zip.forEach((path, entry) => {
            const match = path.match(/ppt\/slides\/slide(\d+)\.xml$/);
            if (match) slideFiles.push({ num: parseInt(match[1]), path: path });
        });
        slideFiles.sort((a, b) => a.num - b.num);

        // Get relationships to find images
        const slideRels = {};
        for (const sf of slideFiles) {
            const relPath = sf.path.replace('ppt/slides/', 'ppt/slides/_rels/') + '.rels';
            if (zip.file(relPath)) {
                const relXml = await zip.file(relPath).async('text');
                const parser = new DOMParser();
                const relDoc = parser.parseFromString(relXml, 'text/xml');
                const rels = relDoc.getElementsByTagName('Relationship');
                slideRels[sf.num] = {};
                for (let r of rels) {
                    slideRels[sf.num][r.getAttribute('Id')] = r.getAttribute('Target');
                }
            }
        }

        // Parse each slide
        for (const sf of slideFiles) {
            const xml = await zip.file(sf.path).async('text');
            const canvas = await renderSlideToCanvas(xml, zip, slideRels[sf.num] || {});
            slides.push(canvas.toDataURL('image/png'));
        }

        if (slides.length === 0) {
            alert('No slides found in this file.');
            document.getElementById('loading').style.display = 'none';
            return;
        }

        // Show presenter
        document.getElementById('uploadScreen').style.display = 'none';
        document.getElementById('presenterScreen').style.display = 'flex';
        document.getElementById('totalNum').textContent = slides.length;
        buildThumbnails();
        showSlide(0);

    } catch(err) {
        console.error(err);
        alert('Error loading file: ' + err.message);
        document.getElementById('loading').style.display = 'none';
    }
}

async function renderSlideToCanvas(xml, zip, rels) {
    const canvas = document.createElement('canvas');
    canvas.width = 1280;
    canvas.height = 720;
    const ctx = canvas.getContext('2d');

    // Parse XML
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, 'text/xml');

    // Background - default white
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, 1280, 720);

    // Try to get background color
    const bgFills = doc.getElementsByTagName('a:srgbClr');

    // Scale factors (EMU to pixels, standard slide is 12192000 x 6858000 EMU)
    const scaleX = 1280 / 12192000;
    const scaleY = 720 / 6858000;

    // Get all shape trees
    const spTree = doc.getElementsByTagName('p:spTree')[0];
    if (!spTree) return canvas;

    // Process shapes
    const shapes = [];
    for (const child of spTree.children) {
        const tag = child.tagName || child.nodeName;
        if (tag === 'p:sp' || tag === 'p:pic' || tag === 'p:grpSp') {
            shapes.push(child);
        }
    }

    for (const shape of shapes) {
        await renderShape(ctx, shape, zip, rels, scaleX, scaleY);
    }

    return canvas;
}

async function renderShape(ctx, shape, zip, rels, scaleX, scaleY) {
    // Get position and size
    const xfrm = shape.getElementsByTagName('a:xfrm')[0];
    let x = 0, y = 0, w = 1280, h = 720;
    if (xfrm) {
        const off = xfrm.getElementsByTagName('a:off')[0];
        const ext = xfrm.getElementsByTagName('a:ext')[0];
        if (off) { x = parseInt(off.getAttribute('x') || 0) * scaleX; y = parseInt(off.getAttribute('y') || 0) * scaleY; }
        if (ext) { w = parseInt(ext.getAttribute('cx') || 0) * scaleX; h = parseInt(ext.getAttribute('cy') || 0) * scaleY; }
    }

    // Check for image (p:pic or blipFill)
    const blips = shape.getElementsByTagName('a:blip');
    if (blips.length > 0) {
        const embed = blips[0].getAttribute('r:embed');
        if (embed && rels[embed]) {
            let imgPath = rels[embed];
            if (!imgPath.startsWith('ppt/')) imgPath = 'ppt/slides/' + imgPath;
            imgPath = imgPath.replace('../', 'ppt/');
            const imgFile = zip.file(imgPath);
            if (imgFile) {
                try {
                    const blob = await imgFile.async('blob');
                    const img = await loadImage(URL.createObjectURL(blob));
                    ctx.drawImage(img, x, y, w, h);
                } catch(e) { console.warn('Image load failed:', e); }
            }
        }
        return;
    }

    // Shape fill
    const solidFills = shape.getElementsByTagName('a:solidFill');
    for (const fill of solidFills) {
        const srgb = fill.getElementsByTagName('a:srgbClr')[0];
        if (srgb) {
            const parent = fill.parentNode;
            const parentTag = parent.tagName || parent.nodeName;
            if (parentTag === 'a:rPr' || parentTag === 'a:defRPr') continue;
            ctx.fillStyle = '#' + srgb.getAttribute('val');
            ctx.fillRect(x, y, w, h);
            break;
        }
    }

    // Text
    const txBody = shape.getElementsByTagName('p:txBody')[0];
    if (!txBody) return;

    const paragraphs = txBody.getElementsByTagName('a:p');
    let textY = y + 10;
    const lineHeight = 1.3;

    for (const para of paragraphs) {
        let fontSize = 18;
        let fontBold = false;
        let fontItalic = false;
        let fontColor = '#333333';
        let align = 'left';

        // Paragraph properties
        const pPr = para.getElementsByTagName('a:pPr')[0];
        if (pPr) {
            const algn = pPr.getAttribute('algn');
            if (algn === 'ctr') align = 'center';
            else if (algn === 'r') align = 'right';

            const defRPr = pPr.getElementsByTagName('a:defRPr')[0];
            if (defRPr && defRPr.getAttribute('sz')) {
                fontSize = parseInt(defRPr.getAttribute('sz')) / 100;
            }
        }

        const runs = para.getElementsByTagName('a:r');
        let lineText = '';
        let runStyles = [];

        for (const run of runs) {
            const rPr = run.getElementsByTagName('a:rPr')[0];
            let rSize = fontSize;
            let rBold = fontBold;
            let rItalic = fontItalic;
            let rColor = fontColor;

            if (rPr) {
                if (rPr.getAttribute('sz')) rSize = parseInt(rPr.getAttribute('sz')) / 100;
                if (rPr.getAttribute('b') === '1') rBold = true;
                if (rPr.getAttribute('i') === '1') rItalic = true;
                const srgb = rPr.getElementsByTagName('a:srgbClr')[0];
                if (srgb) rColor = '#' + srgb.getAttribute('val');
            }

            const textEl = run.getElementsByTagName('a:t')[0];
            if (textEl && textEl.textContent) {
                runStyles.push({ text: textEl.textContent, size: rSize, bold: rBold, italic: rItalic, color: rColor });
                lineText += textEl.textContent;
            }
        }

        if (lineText.trim() === '') {
            textY += fontSize * lineHeight;
            continue;
        }

        // Render runs
        let textX = x + 10;
        if (align === 'center') {
            ctx.font = fontSize + 'px sans-serif';
            const totalWidth = ctx.measureText(lineText).width;
            textX = x + (w - totalWidth) / 2;
        } else if (align === 'right') {
            ctx.font = fontSize + 'px sans-serif';
            const totalWidth = ctx.measureText(lineText).width;
            textX = x + w - totalWidth - 10;
        }

        for (const rs of runStyles) {
            let fontStr = '';
            if (rs.italic) fontStr += 'italic ';
            if (rs.bold) fontStr += 'bold ';
            fontStr += rs.size + 'px sans-serif';
            ctx.font = fontStr;
            ctx.fillStyle = rs.color;
            ctx.fillText(rs.text, textX, textY + rs.size);
            textX += ctx.measureText(rs.text).width;
        }

        textY += (runStyles.length > 0 ? Math.max(...runStyles.map(r => r.size)) : fontSize) * lineHeight;
    }
}

function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });
}

function buildThumbnails() {
    const panel = document.getElementById('slidePanel');
    panel.innerHTML = '';
    slides.forEach((src, i) => {
        const div = document.createElement('div');
        div.className = 'thumb' + (i === 0 ? ' active' : '');
        div.id = 'thumb-' + i;
        div.onclick = () => showSlide(i);
        div.innerHTML = '<img src="' + src + '" alt="Slide ' + (i+1) + '"><div class="thumb-label">Slide ' + (i+1) + '</div>';
        panel.appendChild(div);
    });
}

function showSlide(n) {
    if (n < 0 || n >= slides.length) return;
    document.getElementById('thumb-' + current)?.classList.remove('active');
    current = n;
    document.getElementById('mainSlide').src = slides[current];
    document.getElementById('currentNum').textContent = current + 1;
    document.getElementById('thumb-' + current)?.classList.add('active');
    document.getElementById('thumb-' + current)?.scrollIntoView({block: 'nearest'});
}

function nextSlide() { showSlide(current + 1); }
function prevSlide() { showSlide(current - 1); }

function toggleFullscreen() {
    document.body.classList.toggle('fullscreen');
    if (document.body.classList.contains('fullscreen')) {
        document.documentElement.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

function togglePanel() {
    document.getElementById('slidePanel').classList.toggle('hidden');
}

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
    else if (e.key === 'Home') { e.preventDefault(); showSlide(0); }
    else if (e.key === 'End') { e.preventDefault(); showSlide(slides.length - 1); }
    else if (e.key === 'F5') { e.preventDefault(); toggleFullscreen(); }
    else if (e.key === 'Escape') { document.body.classList.remove('fullscreen'); }
});
</script>
</body>
</html>
